server {
    listen 80;
    server_name panel.example.test;
    return 308 https://panel.example.test$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.example.test;
    ssl_certificate /etc/ssl/netatmo/panel.fullchain.pem;
    ssl_certificate_key /etc/ssl/netatmo/panel.key;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location ~ ^/api/voice/(command|interrupt)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 95s;
        client_body_timeout 5s;
        client_max_body_size 256k;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4k;
    }
}
